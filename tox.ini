[tox]
envlist = py39,check

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/
deps =
    defusedxml
    flask
    flask-bootstrap
    flask-cors
    flask-login
    flask-nav
    flask-session
    flask-wtf
    imageio
    matplotlib
    opencv-python-headless
    pandas
    plotly
    pymongo
    raven
    redis
    requests
    scipy
    scikit-learn
    sqlalchemy
    .[dev]
    alembic
    bandit
    codecov
    flask-webtest
    flake8
    flake8-docstrings
    flake8-quotes
    flake8-todo
    isort
    mypy
    pytest
    radon

commands =
    python -m pytest --cov=virasana  virasana/tests

[testenv:check]
commands =
    coverage html --omit=*/scripts/*
    flake8  virasana --builtins='_'  --ignore T000,D,E402,E127,E128,E129,W503,W504
    bandit virasana -r  -x tests/ -s B301,B403,B410,B311
    # As duas linhas abaixo não darão falha, apenas relatório
    isort  virasana --recursive --diff
    flake8 virasana --radon-max-cc=10 --exit-zero --doctests --exclude tests --ignore E402
    # mypy -s bhadrasana

[testenv:navii]
# Gate dos módulos novos (NAVI-I, ciclo de vida, entregas, apreensões, risco histórico, completude): pytest +
# flake8 (aspas, complexidade <= 10) + bandit + radon — o `python qualidade_navii.py` num ambiente isolado.
# Os ambientes py39 e check acima são do código legado (a suíte inteira falha por motivos antigos).
# - Só o que o gate importa, nas versões em que ele passa (requirements-gate.txt); o pacote não é instalado
#   (opencv, scipy, sklearn... ficam de fora): o código vem do PYTHONPATH, com os repositórios irmãos onde a
#   produção os procura (../ajna_docs/commons e ../bhadrasana2, ver wsgi_production.py).
# - Sem passenv: SQL_URI, MONGODB_URI etc. do servidor não chegam aos testes (SQLite em memória e mongomock).
# Uso (Linux, homologação — ver "Como rodar os testes" no CLAUDE.md):
#   tox -e navii                                  # o gate inteiro
#   tox -e navii -- --alterados --desde ORIG_HEAD  # só o afetado pelo último git pull
skip_install = true
deps =
    -r requirements-gate.txt
setenv =
    PYTHONPATH = {toxinidir}{:}{toxinidir}/../ajna_docs/commons{:}{toxinidir}/../bhadrasana2
commands =
    python qualidade_navii.py {posargs}
