; Serviço do HEALTH CHECK do NAVI (virasana/saude/servico_saude.py): uma rodada por dia às 7 h e as pedidas pela tela
; /virasana/saude/ (perfil Supervisor); histórico no Mongo do virasana. Só lê os bancos. Fica fora dos serviços que
; vigia (ciclo de vida, indexador da busca), para o aviso não parar junto com eles. Ver BACKLOG.md ("Health check").
;
; Variáveis de ambiente: as do programa virasana (SQL_URI, MONGODB_URI) e, para medir a busca por texto,
; NAVII_MEILI_CHAVE_ESCRITA (a do indexador) — definidas fora do repositório, no mesmo lugar que SQL_URI.
; Antes da primeira vez: sudo mkdir -p /var/log/virasana/saude && sudo chown ajna /var/log/virasana/saude
; Primeira rodada à mão (sem esperar as 7 h): pela tela ("Rodar agora") ou servico_saude.py --uma-vez.

[program:saude_navi]
directory=//home/ajna/apps/ajna/virasana
command=//home/ajna/apps/ajna/virasana/virasana-venv/bin/python virasana/saude/servico_saude.py
autostart=true
autorestart=true
user=ajna
stderr_logfile=/var/log/virasana/saude/error.log
stdout_logfile=/var/log/virasana/saude/access.log
