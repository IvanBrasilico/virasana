; Indexador da busca por texto do NAVI-I (virasana/navii/indexador_texto.py) — mantém o índice navii_ces do
; Meilisearch a partir do Mercante (só lê o MariaDB). Instalação e chaves: virasana/navii/MEILISEARCH.md.
;
; autostart=false até a 1ª carga ser conferida (indexador_texto.py --uma-vez --simula, depois --uma-vez e --situacao).
; Variáveis de ambiente: as do programa virasana (SQL_URI) e NAVII_MEILI_CHAVE_ESCRITA (e NAVII_MEILI_URL, se não for
; http://127.0.0.1:7700) — definidas fora do repositório, no mesmo lugar que SQL_URI.
; Antes da primeira vez: sudo mkdir -p /var/log/virasana/navii_texto && sudo chown ajna /var/log/virasana/navii_texto

[program:navii_texto]
directory=//home/ajna/apps/ajna/virasana
command=//home/ajna/apps/ajna/virasana/virasana-venv/bin/python virasana/navii/indexador_texto.py
autostart=false
autorestart=true
user=ajna
stderr_logfile=/var/log/virasana/navii_texto/error.log
stdout_logfile=/var/log/virasana/navii_texto/access.log
