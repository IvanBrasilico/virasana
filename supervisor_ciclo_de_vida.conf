; Ciclo de Vida v2 — serviço por eventos (virasana/analytic_scripts/ciclo_de_vida/servico_ciclo_de_vida.py).
; Ver CICLO_DE_VIDA.md, seção "Ativação no Servidor".
;
; NUNCA rodar o de produção junto com o loop antigo (manager_ciclo_de_vida.py): os dois gravam nas mesmas
; tabelas. Por isso autostart=false: a troca é manual — parar o programa antigo e iniciar este; rollback é o
; inverso (o manager_ciclo_de_vida.py não foi alterado).
; As variáveis de ambiente (SQL_URI, SQL_URI_HOM, MONGODB_URI) são as mesmas do programa antigo.
; Antes da primeira vez: sudo mkdir -p /var/log/virasana/ciclo_de_vida && sudo chown ajna /var/log/virasana/ciclo_de_vida

[program:ciclo_de_vida_v2_hom]
; homologação (banco de SQL_URI_HOM) — para validar antes da produção
directory=//home/ajna/apps/ajna/virasana
command=//home/ajna/apps/ajna/virasana/virasana-venv/bin/python virasana/analytic_scripts/ciclo_de_vida/servico_ciclo_de_vida.py --homologacao
autostart=false
autorestart=true
user=ajna
stderr_logfile=/var/log/virasana/ciclo_de_vida/hom_error.log
stdout_logfile=/var/log/virasana/ciclo_de_vida/hom_access.log

[program:ciclo_de_vida_v2]
; produção (banco de SQL_URI) — só depois de parar o programa do loop antigo
directory=//home/ajna/apps/ajna/virasana
command=//home/ajna/apps/ajna/virasana/virasana-venv/bin/python virasana/analytic_scripts/ciclo_de_vida/servico_ciclo_de_vida.py
autostart=false
autorestart=true
user=ajna
stderr_logfile=/var/log/virasana/ciclo_de_vida/error.log
stdout_logfile=/var/log/virasana/ciclo_de_vida/access.log
